#######################################################################
## Clean Nozzle
#######################################################################
[gcode_macro nozzle_clean]
gcode:
  {% set LOWERED_EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|int %}
  {% set WIPES = params.WIPES|default(3)|int %}
  #Position the nozzle
  G90
  M104 S{LOWERED_EXTRUDER_TEMP} ; set hotend temp without waiting
  G28
  #Heat up nozzle to extruder temperature - 40°C
  {action_respond_info("Clean nozzle: Heating up to {}°C the do {} wipes.".format(
    (LOWERED_EXTRUDER_TEMP),
    (WIPES)
  ))}
  G1 X-8 Y4 Z15 F3000 ; move to first hole
  G1 Z8 F1000 ; move down slightly into tube
  #Bring the nozzle down
  G1 Z6
  M109 S{LOWERED_EXTRUDER_TEMP}
  G91
  G1 E25 F300 ; extrude 25mm to flush nozzle
  G4 S500
  G1 E-10 F1000 ; retract to avoid stringing
  G90
  M106 S255
  #Slow deep swiping the nozzle
  G1 Z7.5
  {% for wipe in range(WIPES) %}
    G1 Y4 F1500
    G1 Y30 F1500
  {% endfor %}

  #Fast, light swiping the nozzle
  G1 Z9
  {% for wipe in range(WIPES) %}
    G1 Y4 F4000
    G1 Y30 F4000
  {% endfor %}

  G1 X-8 Y30 Z15 F3000
  G1 Z6
  {% for wipe in range(WIPES) %}
    G1 Y32 F3000
    G1 X-6 F3000
    G1 Y28 F3000
    G1 X-8 F300
    G1 Y32 F3000
  {% endfor %}
  G1 X-8 Y30 Z15 F3000
  M106 S0
  G91
  G1 E-10 F1000 ; retract to avoid stringing
  G90


[gcode_macro nozzle_clean_homed]
gcode:
  {% set LOWERED_EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|int %}
  {% set WIPES = params.WIPES|default(3)|int %}
  #Position the nozzle
  G90          ; absolute positioning
  M83          ; relative extruder mode
  M104 S{LOWERED_EXTRUDER_TEMP} ; set hotend temp without waiting
  #G28 skip homing
  #Heat up nozzle to extruder temperature - 40°C
  {action_respond_info("Clean nozzle: Heating up to {}°C the do {} wipes.".format(
    (LOWERED_EXTRUDER_TEMP),
    (WIPES)
  ))}
  G1 Z15 F1000 ; raise Z first before any XY move (safety)
  G1 X-8 Y4 Z15 F3000 ; move to first hole
  G1 Z8 F1000 ; move down slightly into tube
  #Bring the nozzle down
  G1 Z6
  M109 S{LOWERED_EXTRUDER_TEMP}
  G91
  G1 E25 F300 ; extrude 25mm to flush nozzle
  G4 S500
  G1 E-10 F600 ; retract to avoid stringing
  G90
  M106 S255
  #Slow deep swiping the nozzle
  G1 Z7.5
  {% for wipe in range(WIPES) %}
    G1 Y4 F1500
    G1 Y30 F1500
  {% endfor %}

  #Fast, light swiping the nozzle
  G1 Z9
  {% for wipe in range(WIPES) %}
    G1 Y4 F4000
    G1 Y30 F4000
  {% endfor %}

  G1 X-8 Y30 Z15 F3000
  G1 Z6
  {% for wipe in range(WIPES) %}
    G1 Y32 F3000
    G1 X-6 F3000
    G1 Y28 F3000
    G1 X-8 F3000
    G1 Y32 F3000
  {% endfor %}
  G1 X-8 Y30 Z15 F3000
  M106 S0
  G91
  G1 E-5 F600 ; retract to avoid stringing
  G90
  G92 0.0

#######################################################################
## Wipe Nozzle
#######################################################################
[gcode_macro nozzle_wipe]
gcode:
  {% set WIPES = params.WIPES|default(3)|int %}
  #Position the nozzle
  G90
  G28
  G90
  #Heat up nozzle to extruder temperature - 40°C
  {action_respond_info("Wiping nozzle: do {} wipes.".format(
    (WIPES)
  ))}
  G1 X-8 Y4 Z15 F3000 ; move to first hole
  ;M109 S{LOWERED_EXTRUDER_TEMP}
  M106 S255
  #Slow deep swiping the nozzle
  G1 Z9
  {% for wipe in range(WIPES) %}
    G1 Y3 F1500
    G1 Y40 F1500
  {% endfor %}

  #Fast, light swiping the nozzle
  G1 Z9.8
  {% for wipe in range(WIPES) %}
    G1 Y3 F8000
    G1 Y40 F8000
  {% endfor %}
  G1 Z15
  # move to last hole and do a circular wipe inside
  G1 X-7 Y35 F3000
  G1 Z7
  {% for wipe in range(WIPES) %}
    G1 Y36 F3000
    G1 X-6 F3000
    G1 Y34 F3000
    G1 X-8 F3000
    G1 Y35 F3000
  {% endfor %}

  {% for wipe in range(WIPES) %}
    G1 Y36 F3000
    G1 X-6 F3000
    G1 Y34 F3000
    G1 X-8 F3000
    G1 Y35 F3000
  {% endfor %}
  G1 X-10 Y35 Z15 F3000
  M106 S0



