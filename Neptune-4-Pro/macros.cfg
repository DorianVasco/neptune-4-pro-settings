[gcode_macro WIPE_NOZZLE]
description: Wipes nozzle beside the bed.
gcode:
  M104 S200 ; hotend temp 200
  G90 ; absolute mode
  G28 ; home
  G1 z10 F300 ; move upwards
  G1 y150 x-5 F2000 ; move backwards and outside bed
  G1 z0.2 F200 ; move close to bed
  M109 S200 ; wait for hotend temp 200
  G1 E10 F60 ; extrude a little bit of filament
  G4 S5 ; wait 2 seconds
  G1 F60 E4 ; extrude a little more
  G4 S2 ; wait a second
  ; G1 F1700 E-0.7 ; retrude
  G91 ; relative mode
  G1 x10 y-5 F800 ; move left/right
  G1 x-10 y-5 F800 ; move left/right
  G1 x10 y-5 F1500 ; move left/right
  G1 x-10 y-5 F1500 ; move left/right
  G1 x10 y-5 F2000 ; move left/right
  G1 x-10 y-5 F2000 ; move left/right
  G1 x10 y-5 F2000 ; move left/right
  G1 x-10 y-5 F2000 ; move left/right
  G1 z5 F300
  G1 x10 y-5 F5000 ; move left/right
  G1 x-10 y-5 F5000 ; move left/right
  G1 x10 y-5 F5000 ; move left/right
  G1 x-10 y-5 F5000 ; move left/right
  G1 z10 F300
  G90 ; absolute mode
  G92 E0 ; Reset extruder
  ;M107 ; disable fans

